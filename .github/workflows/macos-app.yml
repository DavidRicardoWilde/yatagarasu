# Builds a universal Yatagarasu.app and publishes it so others can download it.
#
#   push to master      → GitHub Packages (ghcr.io/<owner>/yatagarasu-macos), tag `edge`
#   push a vX.Y.Z tag   → GitHub Packages, tags `X.Y.Z` and `latest`, plus a GitHub Release
#                         with the .dmg and .zip attached for one-click downloads
#   pull request        → build only; the packages are attached to the run as an artifact
#
# The app is ad-hoc signed (no Apple Developer account needed), so it is not
# notarized: the first launch of a browser download needs Control-click › Open.
# See "Download" in README.md.

name: macOS app

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "apps/macos/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/macos-app.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  PACKAGE_NAME: yatagarasu-macos

jobs:
  build:
    name: Build Yatagarasu.app
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./apps/macos/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version (build $GITHUB_RUN_NUMBER) with $(xcodebuild -version | head -n 1)"

      - name: Build and package
        env:
          YATAGARASU_VERSION: ${{ steps.version.outputs.version }}
          YATAGARASU_BUILD_NUMBER: ${{ github.run_number }}
        run: pnpm package:macos

      - uses: actions/upload-artifact@v7
        with:
          name: yatagarasu-macos
          path: |
            apps/macos/dist/*.dmg
            apps/macos/dist/*.zip
            apps/macos/dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-package:
    name: Publish to GitHub Packages
    needs: build
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: yatagarasu-macos
          path: dist

      - uses: oras-project/setup-oras@v2

      - name: Push to ghcr.io
        working-directory: dist
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${PACKAGE_NAME}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags="${VERSION},latest"
          else
            tags="edge,${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi

          dmg=(*.dmg)
          zip=(*.zip)

          oras login ghcr.io --username "$REGISTRY_USER" --password-stdin <<< "$REGISTRY_TOKEN"
          oras push "${package}:${tags}" \
            --artifact-type application/vnd.yatagarasu.macos.app.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.description=Yatagarasu.app (universal) as a .dmg and a .zip" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            "${dmg[0]}:application/x-apple-diskimage" \
            "${zip[0]}:application/zip" \
            "SHA256SUMS.txt:text/plain"

          {
            echo "### Published ${package}"
            echo
            echo "Tags: \`${tags//,/\`, \`}\`"
            echo
            echo '```bash'
            echo "oras pull ${package}:${tags%%,*}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: yatagarasu-macos
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Yatagarasu ${VERSION}" \
              --generate-notes \
              --verify-tag
          fi
